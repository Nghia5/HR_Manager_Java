spring.application.name=nhom3
# Cấu hình Port cho Server chạy (mặc định 8080)
server.port=8080

# Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HR_Management;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Ngoc3103@!
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate (JPA)
# Dùng 'none' vì chúng ta đã tạo database và các bảng bằng Script SQL trước đó rồi
spring.jpa.hibernate.ddl-auto=none 

# Hiển thị log SQL trên console để tiện theo dõi và debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

