<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QL Nhân Sự - Phân công / Kiêm nhiệm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="flex h-screen overflow-hidden bg-[#f4f6f9]">

    <div th:replace="~{fragments/sidebar :: sidebar('employee-position')}"></div>

    <div class="flex-1 flex flex-col">
        <header class="bg-white shadow-sm h-14 flex items-center px-4 justify-between shrink-0">
            <span class="text-sm text-gray-600">Trang chủ / Nghiệp vụ / Phân công Chức vụ</span>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <h1 class="text-2xl font-normal text-gray-800 mb-4">Lịch sử Phân công / Kiêm nhiệm</h1>
            
            <div class="bg-white border border-gray-200 rounded-md shadow-sm">
                <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 class="text-gray-700 font-medium text-lg"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Bảng Employee Positions</h2>
                    <button onclick="openAssignModal()" class="bg-[#0d6efd] hover:bg-[#0b5ed7] text-white px-4 py-2 rounded text-sm flex items-center shadow-sm transition">
                        <i class="fa-solid fa-plus mr-2"></i> Phân công mới
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-white text-gray-800 text-sm border-b uppercase font-bold">
                                <th class="p-3 text-center w-16">STT</th>
                                <th class="p-3">Nhân viên</th>
                                <th class="p-3">Chức vụ đảm nhiệm</th>
                                <th class="p-3">Thời gian</th>
                                <th class="p-3">Ghi chú</th>
                                <th class="p-3 text-center">Trạng thái</th>
                                <th class="p-3 text-center w-32">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="assign-body" class="divide-y divide-gray-100 text-sm">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="assignModal" class="fixed inset-0 bg-black bg-opacity-50 hidden overflow-y-auto h-full w-full z-50 transition-opacity">
        <div class="relative top-10 mx-auto p-6 border w-[700px] shadow-2xl rounded-lg bg-white mb-10">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-xl font-semibold text-gray-800" id="modalTitle">Thêm Phân Công Mới</h3>
                <button onclick="closeAssignModal()" class="text-gray-400 hover:text-gray-600 font-bold text-2xl">&times;</button>
            </div>
            
            <form id="assignForm">
                <input type="hidden" id="assignId">
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nhân viên <span class="text-red-500">*</span></label>
                        <select id="employeeId" class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400" required>
                            <option value="">-- Chọn Nhân viên --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Chức vụ phân công <span class="text-red-500">*</span></label>
                        <select id="positionId" class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400" required>
                            <option value="">-- Chọn Chức vụ --</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Ngày bắt đầu <span class="text-red-500">*</span></label>
                        <input type="datetime-local" id="startDate" class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Ngày kết thúc</label>
                        <input type="datetime-local" id="endDate" class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400" title="Để trống nếu đang đương nhiệm">
                        <span class="text-[10px] text-gray-500 italic mt-1">Để trống nếu đang đương nhiệm</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Mô tả nhiệm vụ</label>
                    <input type="text" id="description" class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400" placeholder="Mô tả tóm tắt (tối đa 255 ký tự)..." maxlength="255">
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Ghi chú thêm</label>
                    <textarea id="note" class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400" rows="3" placeholder="Lý do điều chuyển, quyết định đính kèm..."></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Trạng thái hiệu lực</label>
                    <select id="isActive" class="w-full border rounded px-3 py-2 outline-none bg-gray-50">
                        <option value="true" class="text-green-600 font-semibold">Đang hiệu lực (✅)</option>
                        <option value="false" class="text-gray-500 font-semibold">Hết hiệu lực (❌)</option>
                    </select>
                </div>

                <div class="flex justify-end gap-3 border-t pt-4">
                    <button type="button" onclick="closeAssignModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-md transition font-medium">Hủy</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded-md shadow-md transition font-medium">Lưu Quyết Định</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openAssignModal() {
            document.getElementById('assignModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerText = 'Thêm Phân Công Mới';
            document.getElementById('assignForm').reset();
            document.getElementById('assignId').value = '';
        }

        function closeAssignModal() {
            document.getElementById('assignModal').classList.add('hidden');
        }
    </script>
    <script src="/employee_position.js"></script>
</body>
</html>
