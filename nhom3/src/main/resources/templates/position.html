<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QL Nhân Sự - Chức vụ</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex h-screen overflow-hidden">

    <div th:replace="~{fragments/sidebar :: sidebar('position')}"></div>

    <div class="flex-1 flex flex-col bg-[#f4f6f9]">
        <header class="bg-white shadow-sm h-14 flex items-center px-4 justify-between shrink-0">
            <span class="text-sm text-gray-600">Trang chủ / Quản lý Chức vụ</span>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <h1 class="text-2xl font-normal text-gray-800 mb-4">Danh mục Chức vụ / Vị trí</h1>
            <div class="bg-white border border-gray-200 rounded-md shadow-sm">
                <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 class="text-gray-700 font-medium">Bảng Positions</h2>
                    <button onclick="openAddPosModal()" class="bg-[#0d6efd] hover:bg-[#0b5ed7] text-white px-3 py-1.5 rounded text-sm flex items-center">
                        <i class="fa-solid fa-plus mr-2"></i> Thêm Chức vụ
                    </button>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white text-gray-800 text-sm border-b">
                            <th class="p-3 text-center w-16">STT</th>
                            <th class="p-3 w-32">Mã Chức vụ</th>
                            <th class="p-3">Tên Chức vụ</th>
                            <th class="p-3">Cấp bậc</th>
                            <th class="p-3">Trực thuộc (Khoa)</th>
                            <th class="p-3 text-center">Trạng thái</th>
                            <th class="p-3 text-center w-32">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="pos-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="posModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <h3 class="text-lg font-medium mb-4 text-center" id="posModalTitle">Thêm Chức Vụ Mới</h3>
            <form id="posForm">
                <input type="hidden" id="posId">
                <div class="mb-4 text-left">
                    <label class="block text-sm font-bold mb-1">Mã Chức vụ:</label>
                    <input type="text" id="posCode" class="w-full border rounded px-3 py-2" required>
                </div>
                <div class="mb-4 text-left">
                    <label class="block text-sm font-bold mb-1">Tên Chức vụ:</label>
                    <input type="text" id="posName" class="w-full border rounded px-3 py-2" required>
                </div>
                <div class="mb-4 text-left">
                    <label class="block text-sm font-bold mb-1">Cấp bậc:</label>
                    <input type="text" id="posLevel" class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4 text-left">
                    <label class="block text-sm font-bold mb-1">Thuộc Khoa:</label>
                    <select id="posDeptId" class="w-full border rounded px-3 py-2 bg-white" required></select>
                </div>
                <div class="mb-4 text-left">
                    <label class="block text-sm font-bold mb-1">Trạng thái:</label>
                    <select id="posIsActive" class="w-full border rounded px-3 py-2 bg-white">
                        <option value="true">Hoạt động (✅)</option>
                        <option value="false">Khóa (❌)</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 mt-5">
                    <button type="button" onclick="closePosModal()" class="bg-gray-200 px-4 py-2 rounded">Hủy</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/position.js"></script>
</body>
</html>
