<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="sidebar(activeMenu)" class="sidebar w-64 flex-shrink-0 text-white flex flex-col bg-[#343a40]">
        <div class="p-4 flex items-center border-b border-gray-600 h-16">
            <i class="fa-solid fa-book-open-reader text-2xl mr-3"></i>
            <span class="text-xl font-semibold tracking-wide">QL Nhân Sự</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-2">
            <div class="sidebar-heading px-4 py-2 text-xs text-gray-500 font-bold uppercase">QUẢN LÝ DANH MỤC</div>
            
            <a href="/department" th:classappend="${activeMenu == 'department' ? 'active bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-700'}" class="sidebar-item block px-4 py-2">
                <i class="fa-regular fa-building w-6 text-center mr-2"></i> Khoa / Viện
            </a>
            <a href="/position" th:classappend="${activeMenu == 'position' ? 'active bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-700'}" class="sidebar-item block px-4 py-2">
                <i class="fa-solid fa-briefcase w-6 text-center mr-2"></i> Chức vụ
            </a>
            <a href="/employees" th:classappend="${activeMenu == 'employee' ? 'active bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-700'}" class="sidebar-item block px-4 py-2">
                <i class="fa-solid fa-users w-6 text-center mr-2"></i> Nhân viên
            </a>
            
            <div class="sidebar-heading px-4 py-2 mt-4 text-xs text-gray-500 font-bold uppercase">NGHIỆP VỤ</div>
            
            <a href="/employee-position" th:classappend="${activeMenu == 'employee-position' ? 'active bg-gray-700 text-white' : 'text-gray-300 hover:bg-gray-700'}" class="sidebar-item block px-4 py-2">
                <i class="fa-solid fa-user-tie w-6 text-center mr-2"></i> Phân công chức vụ
            </a>
        </nav>
    </aside>
</body>
</html>
